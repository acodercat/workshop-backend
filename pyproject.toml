[project]
name = "metaseq-backend"
version = "0.1.0"
description = "MetaSeq Agent backend — REST API, auth, SSE streaming, Redis bridge to the agent worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "alibabacloud-dm20151123>=1.9.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "dg-sdk>=2.0.22",
    "email-validator>=2.3.0",
    "fastapi>=0.135.3",
    "greenlet>=3.4.0",
    "gunicorn>=25.3.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openai>=2.32.0",
    "orjson>=3.11.9",
    "oss2>=2.19.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.24",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=7.4.0",
    "sentry-sdk>=2.61.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "sse-starlette>=3.3.4",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
