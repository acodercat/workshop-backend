name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # ``--locked`` rather than a plain sync: it fails when uv.lock does not
      # match pyproject.toml, which is the check that keeps "never hand-edit
      # pyproject" (see CLAUDE.md) enforced rather than merely asked for.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Scope and settings live in [tool.mypy].
      - name: Type check
        run: uv run mypy

      # ``tests/*.py`` is the offline unit suite — no Postgres, no Redis, no
      # network. ``tests/e2e/`` is opt-in via RUN_E2E_TESTS and stays off: it
      # drives the real pipeline and needs a backend, a worker, Postgres,
      # Redis and a sandbox all running.
      #
      # ``.env.example`` is copied rather than a placeholder set being spelled
      # out here. Seven ``Settings`` fields are required with no default, so
      # importing ``config`` — which ``conftest`` does — fails without them;
      # and the example file is the one place that already answers "what does
      # this need to boot", so a new required field breaks CI where the fix is
      # to update it, not somewhere it can drift from.
      - name: Test
        run: |
          cp .env.example .env
          uv run pytest tests/ -q
